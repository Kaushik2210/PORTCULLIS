[project]
name = "portcullis-eval"
version = "0.1.0"
description = "Evaluation harness, baselines, ablations, adaptive attacks"
requires-python = ">=3.13"
dependencies = ["portcullis-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portcullis"]
