[project]
name = "portcullis-client"
version = "0.1.0"
description = "Typed Python SDK for the PORTCULLIS detection API"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portcullis"]
