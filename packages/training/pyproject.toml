[project]
name = "portcullis-training"
version = "0.1.0"
description = "Data pipeline, training, calibration, and ONNX export"
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0",
    "datasketch>=1.6",
    "onnx>=1.17",
    "onnxruntime>=1.29",
    "portcullis-core",
    "scikit-learn>=1.5",
    "torch>=2.6",
    "transformers>=4.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portcullis"]
