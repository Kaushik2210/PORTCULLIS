[project]
name = "portcullis-gateway"
version = "0.1.0"
description = "OpenAI-compatible proxy and standalone detection API"
requires-python = ">=3.13"
dependencies = ["portcullis-core", "fastapi>=0.120", "pydantic>=2.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portcullis"]
