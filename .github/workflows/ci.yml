name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  check:
    name: lint + types + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target: the kNN sidecar depends on a binary
        # wheel that is not available for every index library (ADR-0003), and a
        # Linux-only CI would not have caught that.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync workspace
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy packages tests

      - name: pytest (functional)
        run: uv run pytest -q -m "not slow and not needs_infra and not needs_model"

      # Separate step, and deliberately so: a latency assertion measured while
      # the property suite saturates the runner is measuring contention.
      - name: pytest (latency guards)
        run: uv run pytest -q -m "slow and not needs_infra and not needs_model"

  compose:
    name: compose file validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose
        run: docker compose -f ops/compose.yaml config --quiet
